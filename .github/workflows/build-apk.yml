name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            python3-pip \
            python3-dev \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            libunwind-dev \
            openjdk-17-jdk \
            autoconf \
            libtool \
            pkg-config \
            unzip \
            libffi-dev \
            libssl-dev

      - name: Install Python Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade cython==0.29.36 buildozer

      - name: Initialize Buildozer Spec
        run: |
          buildozer init || true
          sed -i 's/#title = My Application/title = SCADA Energy System/' buildozer.spec
          sed -i 's/#package.name = myapp/package.name = energysystem/' buildozer.spec
          sed -i 's/#package.domain = org.test/package.domain = org.scada/' buildozer.spec
          sed -i 's/#source.include_exts = py,png,jpg,kv,atlas/source.include_exts = py,png,jpg,kv,atlas,txt/' buildozer.spec
          sed -i 's/#requirements = python3,kivy/requirements = python3,kivy,requests,pandas,numpy/' buildozer.spec
          sed -i 's/#orientation = portrait/orientation = landscape/' buildozer.spec
          sed -i 's/#android.permissions =/android.permissions = INTERNET/' buildozer.spec

      - name: Build APK with Buildozer
        run: |
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: bin/*.apk
