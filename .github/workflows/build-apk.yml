name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython

      - name: Install Android SDK dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git openjdk-17-jdk zlib1g-dev libncurses5-dev libstdc++6 zlib1g:i386 libbz2-dev

      - name: Initialize Buildozer
        run: |
          buildozer init || true
          sed -i 's/#title = My Application/title = SCADA Energy System/' buildozer.spec
          sed -i 's/#package.name = myapp/package.name = energysystem/' buildozer.spec
          sed -i 's/#package.domain = org.test/package.domain = org.scada/' buildozer.spec
          sed -i 's/#requirements = python3,kivy/requirements = python3,streamlit,pandas,numpy,plotly/' buildozer.spec
          sed -i 's/#orientation = portrait/orientation = landscape/' buildozer.spec

      - name: Build with Buildozer
        run: |
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: bin/*.apk
